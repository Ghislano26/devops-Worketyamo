# ks.cfg — Kickstart minimal pour Rocky Linux 9 (installation automatique pour Packer).
# Servi par le serveur HTTP temporaire de Packer ; ne contient AUCUN secret réel :
# le mot de passe « vagrant » est la convention des box Vagrant publiques et la connexion
# par mot de passe est désactivée par scripts/03-hardening.sh.

# --- Installation en mode texte, depuis les dépôts réseau (ISO minimale) ---
text
url --url="https://dl.rockylinux.org/vault/rocky/9.4/BaseOS/x86_64/os/"
repo --name="AppStream" --baseurl="https://dl.rockylinux.org/vault/rocky/9.4/AppStream/x86_64/os/"

# --- Localisation ---
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# --- Réseau : DHCP pendant l'installation ---
network --bootproto=dhcp --device=link --activate --onboot=yes
firewall --disabled
selinux --permissive

# --- Comptes : root verrouillé, utilisateur vagrant avec sudo ---
rootpw --lock
user --name=vagrant --password=vagrant --plaintext --groups=wheel

# --- Services ---
services --enabled=sshd

# --- Disque : /boot 1 Go (ext4), swap 2 Go, / (ext4) = le reste ---
zerombr
clearpart --all --initlabel
bootloader --location=mbr
part /boot --fstype=ext4 --size=1024
part swap  --size=2048
part /     --fstype=ext4 --size=1 --grow

# --- Pas d'assistant de premier démarrage ---
firstboot --disable
skipx

# --- Paquets ---
%packages --ignoremissing
@core
openssh-server
sudo
curl
wget
vim-minimal
%end

# --- Post-installation ---
%post --log=/root/ks-post.log
set -u

# sudo sans mot de passe pour vagrant
echo 'vagrant ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/vagrant
chmod 0440 /etc/sudoers.d/vagrant

# Clé SSH publique « insecure » de Vagrant : Vagrant la remplace par une clé unique au premier
# « vagrant up ». On la télécharge depuis le dépôt officiel de HashiCorp.
install -d -m 0700 -o vagrant -g vagrant /home/vagrant/.ssh
curl -fsSL https://raw.githubusercontent.com/hashicorp/vagrant/main/keys/vagrant.pub \
  -o /home/vagrant/.ssh/authorized_keys \
  || echo "ATTENTION : clé insecure de Vagrant non téléchargée" >> /root/ks-post.log
chmod 0600 /home/vagrant/.ssh/authorized_keys
chown -R vagrant:vagrant /home/vagrant/.ssh
restorecon -R /home/vagrant/.ssh 2>/dev/null || true

# SELinux en mode permissif (persistant) — voir scripts/03-hardening.sh pour la justification
sed -i 's/^SELINUX=.*/SELINUX=permissive/' /etc/selinux/config

# Pas de « requiretty » pour sudo ; sshd utilisable avant le premier démarrage complet
sed -i 's/^Defaults.*requiretty/# &/' /etc/sudoers 2>/dev/null || true
%end

# --- Redémarrage automatique à la fin ---
reboot --eject
